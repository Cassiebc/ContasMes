<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Caderno de Contas</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Caderno" />
    <meta name="theme-color" content="#f5f5f4" />
    <!-- Ao mexer neste script, recalcule o hash sha256 dele na
         Content-Security-Policy do vercel.json, senão ele é bloqueado
         em produção e o app volta a piscar claro antes de escurecer. -->
    <script>
      try {
        var tema = localStorage.getItem("tema");
        var escuro = tema ? tema === "escuro" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (escuro) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
